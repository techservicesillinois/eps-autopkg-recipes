Comment: Set ARCHITECTURE to x86_64 or arm64
Identifier: com.github.eps-autopkg-recipes.jamf.KeePassXC
ParentRecipe: com.github.eps-autopkg-recipes.jamf.KeePassXC.sign
MinimumVersion: '2.3'

Input:
  ARCH: 'arm64'
  ARCHITECTURE: 'arm64'
  ASSET_REGEX: 'KeePassXC-.*-%ARCHITECTURE%\.dmg'
  CATEGORY: 'Utilities'
  DOWNLOAD_PREDICATE: 'download_changed == False'
  GROUP_CRITERIA: '%ARCHITECTURE%'
  GROUP_NAME: 'Global - %NAME% - Testing -'
  GROUP_TEMPLATE: 'SmartGroupTemplate.xml'
  NAME: 'KeePassXC'
  POLICY_CATEGORY: 'Software Testing (AutoPkg)'
  POLICY_NAME: 'Global - %NAME% - Testing -'
  POLICY_TEMPLATE: 'PolicyTemplate.xml'
  SELF_SERVICE_DESCRIPTION: |
    Never forget a password again.
    Securely store passwords using industry standard encryption, quickly auto-type them into desktop applications, and use our browser extension to log into websites.
  SELF_SERVICE_ICON: 'KeePassXC.png'
  SIGNING_CERTIFICATE: 'Jamf_AutoPkg'
  SOFTWARE_TITLE: '%NAME%'
  TESTING_GROUP_NAME: 'Global - Software Testing - Update'
  UPDATE_PREDICATE: 'pkg_uploaded == False'

Process:

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: '%CATEGORY%'

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPackageUploader
    Arguments:
      pkg_category: '%CATEGORY%'

  - Processor: PathDeleter
    Arguments:
      path_list: '%pkg_path%'

  - Processor: StopProcessingIf
    Arguments:
      predicate: '%UPDATE_PREDICATE%'

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_template: '%GROUP_TEMPLATE%'
      computergroup_name: '%GROUP_NAME%'

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Arguments:
      policy_template: '%POLICY_TEMPLATE%'
      policy_name: '%POLICY_NAME%'
      icon: '%SELF_SERVICE_ICON%'
